[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpmini"
dynamic = ["version"]
description = "A small readable MCP library for serving Python functions as tools and calling MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AnswerDotAI/mcpmini"
Documentation = "https://AnswerDotAI.github.io/mcpmini/"

[project.entry-points.nbdev]
mcpmini = "mcpmini._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "mcpmini.__version__"}

[tool.setuptools.packages.find]
include = ["mcpmini"]

[tool.nbdev]
